# Foundation application configuration
app-name = "prime-paper-wallet"
friendly-app-name = "Paper Wallet"
launcher-app-name = "Paper Wallet"
description = "Generate bitcoin gift paper wallets: SegWit or Taproot bills with printable QR codes, offline, with an optional seed-recoverable backup spend path."
icon = "resources/icon.svg"
theme = "resources/theme.json"
signing-identity = "byteapps"
app-id = "0xe87412f1b8afbe1898ecd016f19ff001"
min-keyos-version = "1.0.0"

[publisher]
name = "ByteApps LLC"
contact-email = "salvador@byteapps.com"
support-url = "https://byteapps.com"

[permissions]
template = ["gui-app", "fs-generic", "fs-access"]
# MountAirlock/FormatAirlock are GONE. They are Foundation-only, which the
# current SDK rejects at build time, and they were already dead here: the
# code stopped calling them when ensure_airlock_mounted became a plain
# open_dir() probe — only a comment still referenced them. On hardware the
# system owns the Airlock mount lifecycle, and the hosted sim has no Airlock
# at all, so an app-side mount was never the right shape. See KeyOS#9, where
# Foundation confirmed these abort the app on denial (send_blocking_scalar
# is try_send(..).unwrap()), which is what stopped the intended
# mount-else-fall-back-to-Internal path from ever running.
# Deterministic backup keys for taproot gift wallets: HMAC-derived per-app
# seed from the wallet master seed (PIN-gated on hardware; kernel-attested
# app identity). The printed gift key itself is pure TRNG, never seed-derived.
"os/security" = ["GetAppSeed"]
